<html lang="en"><head><meta charset="utf-8">

<title>Upper Respiratory Symptoms – Clinical Guide</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--tx:#1b2430;--mu:#5f6b7a;--ac:#1f6feb;--ac2:#e8f0fe;--bd:#dde2ea;--rd:#c62828;--gr:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#1a212b;--tx:#e6ebf2;--mu:#98a4b4;--ac:#6ea8ff;--ac2:#1d2b44;--bd:#2c3644;--rd:#ff8a80;--gr:#81c784;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#1a212b;--tx:#e6ebf2;--mu:#98a4b4;--ac:#6ea8ff;--ac2:#1d2b44;--bd:#2c3644;--rd:#ff8a80;--gr:#81c784;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px 4px}h1{font-size:19px;margin:0}header p{margin:2px 0 0;color:var(--mu);font-size:12.5px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:20px;font-size:14px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:4px 16px 40px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
h2{font-size:16px;margin:14px 0 6px}h3{font-size:12px;margin:10px 0 2px;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:5px 10px;border-radius:16px;font-size:13px}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}.chip.m{background:var(--ac2);color:var(--ac);border-color:var(--ac2);font-size:12px;padding:2px 8px}
input[type=search]{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:8px 0}summary{padding:11px 14px;font-weight:600;cursor:pointer}
details>div{padding:0 14px 12px}.rf{color:var(--rd)}.mu{color:var(--mu);font-size:13px}.tag{font-size:11px;color:var(--mu);font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}td,th{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:14px}.wrap{overflow-x:auto}
label.k{display:flex;gap:8px;padding:6px 0}.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
.opt.ok{border-color:var(--gr);background:rgba(46,125,50,.15)}.opt.no{border-color:var(--rd);background:rgba(198,40,40,.12)}
</style></head><body>
<header><h1>Upper Respiratory Symptoms</h1><p>Earache • Sinus symptoms • Sore throat — based on Harrison’s, Ch. 35. Educational aid, not a substitute for clinical judgment.</p></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const L={earpain:"Ear pain",otorrhea:"Ear discharge",hearing:"Hearing loss",earfull:"Ear fullness",tragus:"Pain moving auricle/tragus",postaur:"Postauricular swelling/tenderness",swim:"Swimming / canal trauma",
rhino:"Rhinorrhea",cong:"Nasal congestion",nasdis:"Purulent nasal discharge",facial:"Facial pain/pressure",anosmia:"Hyposmia/anosmia",polyps:"Nasal polyps",
sore:"Sore throat",exud:"Tonsillar exudate/swelling",nodes:"Tender anterior cervical nodes",nocough:"No cough",pseudo:"Grayish pseudomembrane",hoarse:"Hoarseness / voice loss",dysph:"Dysphagia / odynophagia",hotp:"Hot-potato voice",drool:"Drooling",trism:"Trismus",stridor:"Stridor / airway compromise",neck:"Neck pain / swelling / stiffness",scarl:"Scarlatiniform rash",postnodes:"Posterior cervical nodes",
fever:"Fever",myalgia:"Myalgia / malaise",rash:"Rash",rigors:"Rigors",spleen:"Splenomegaly",child:"Child",diab:"Diabetes / immunocompromised",sex:"New sexual partner / oral sex",travel:"Travel to endemic area",cough:"Cough"};
const G={"Ear":["earpain","otorrhea","hearing","earfull","tragus","postaur","swim"],"Nose / sinus":["rhino","cong","nasdis","facial","anosmia","polyps"],"Throat / neck":["sore","exud","nodes","nocough","postnodes","pseudo","scarl","hoarse","dysph","hotp","drool","trism","stridor","neck"],"General / risk":["fever","myalgia","rash","rigors","spleen","cough","child","diab","sex","travel"]};
const D=[
{n:"Nonspecific URI (common cold)",c:"URI",t:["rhino","cong","sore","cough","fever","myalgia"],
pt:"Rhinoviruses (>100 serotypes), coronaviruses, RSV, influenza, adenovirus, metapneumovirus. Spread by droplets, contact, surfaces; incubation 2–8 d. Mucosal inflammation causes congestion and rhinorrhea. Reinfection is common because of serotype diversity.",
dx:"Clinical; no single dominant symptom. Consider influenza, measles, acute HIV, COVID-19. Symptoms peak early, last 5–10 d, up to 14 d. Exam: conjunctivitis, pharyngeal erythema, boggy mucosa, clear to purulent mucus.",
tx:"Symptom-based: acetaminophen/NSAID; ipratropium for rhinorrhea; oxymetazoline (≤5 d) or pseudoephedrine; dextromethorphan/benzonatate for cough. No antibiotics. Children <6 y: no cough/cold medicines; honey for >1 y. Ineffective: echinacea, zinc, vitamin C, steam, antihistamines, antivirals.",
rf:"Fever >102°F, chest pain, dyspnea, dizziness, confusion, sinus pain, symptoms >14 d."},
{n:"Otitis externa (incl. malignant)",c:"Ear",t:["earpain","otorrhea","hearing","tragus","swim"],
pt:"Infection/inflammation of external canal: Pseudomonas, S. aureus; fungi (Aspergillus, Candida). Risks: swimming, cotton swabs/hearing aids, narrow canal, cerumen, eczema, psoriasis. Malignant OE: skull-base spread in diabetics/immunosuppressed (CN VII, IX, XI, XII).",
dx:"Pain on moving auricle/tragus; canal erythematous, edematous, ± exudate. Fungal: itch, discharge, little pain. Contrast AOM with perforation: discharge without tragal tenderness.",
tx:"Analgesia + topical antibacterial/glucocorticoid 7–10 d (ciprofloxacin–hydrocortisone; avoid polymyxin B–neomycin–hydrocortisone if TM perforation). Wick if canal swollen. Oral antibiotics are ineffective. Prevent with acetic acid/aluminum acetate drops. Malignant OE: antipseudomonal antibiotics, IV pain control, may need IV.",
rf:"Diabetes/immunosuppression with severe pain, fever or cranial nerve palsy → malignant OE."},
{n:"Acute otitis media (AOM)",c:"Ear",t:["earpain","fever","otorrhea","hearing","child"],
pt:"Viral URI → nasopharyngeal/eustachian tube edema → middle-ear fluid → bacterial infection (S. pneumoniae, non-typeable H. influenzae, M. catarrhalis). Peak 6–24 mo; short horizontal eustachian tube.",
dx:"Child: moderate–severe bulging TM or new otorrhea (not OE); mild bulging if symptoms <48 h or intense erythema. Do not diagnose without middle-ear effusion. Signs: bulging cloudy TM, immobile on pneumatic otoscopy, conductive loss. Severe: otalgia ≥2 d, T >102.2°F.",
tx:"NSAID/acetaminophen (± topical anesthetic). Up to 80% resolve without antibiotics. Treat: <6 mo; bilateral 6 mo–2 y; otorrhea; severe; or no improvement 48–72 h (>2 y). First line high-dose amoxicillin 90 mg/kg/d (max 3 g); alternatives cefdinir, cefuroxime, cefpodoxime, IM ceftriaxone; amoxicillin in prior 30 d → amoxicillin/clavulanate. Duration: 10 d (<2 y or severe), 5–7 d (2–5 y mild–moderate), 5 d (≥6 y). Failure at 48–72 h → amox/clav or cephalosporin/IM ceftriaxone ×3 d. Recurrent (3 in 6 mo / 4 in 1 y) → ENT, tympanostomy tubes.",
rf:"Postauricular swelling (mastoiditis), failure after change of antibiotic."},
{n:"Otitis media with effusion (OME)",c:"Ear",t:["hearing","earfull","child"],
pt:"Fluid without acute infection; sequela of AOM or allergy; eustachian dysfunction, craniofacial anomaly, GERD, adenoids. >60% in children <2 y.",
dx:"Decreased hearing/language delay; TM gray/amber, air-fluid levels or bubbles, reduced mobility. Audiometry, tympanometry. Resolves in 4–6 wk; >3 mo = chronic.",
tx:"Watchful waiting. Persistent: tympanostomy tubes ± adenoidectomy. Antihistamines, steroids, antibiotics do not help. Early referral if speech/language delay risk.",
rf:"Unilateral persistent effusion in adults—consider other causes; cholesteatoma."},
{n:"Acute mastoiditis",c:"Ear",t:["earpain","fever","postaur","otorrhea","child"],
pt:"Spread of infection from middle ear via aditus to antrum into mastoid air cells; incipient (fluid) → coalescent with bony destruction/abscess. Most <2 y. Consider cholesteatoma in older children.",
dx:"Postauricular tenderness/mass, protruding ear lobe. Raised inflammatory markers, WBC. CT (bone, abscess); MRI with gadolinium for vascular/intracranial complications. DDx: cellulitis, lymphadenopathy, tumors (rhabdomyosarcoma).",
tx:"Admit; IV antibiotics + myringotomy ± tympanostomy tube; mastoidectomy if no improvement in 48 h. Empiric IV vancomycin (or for MRSA/resistant pneumococcus) + cephalosporin (cefepime/ceftazidime); recurrent AOM → vancomycin + antipseudomonal penicillin. IV 7–10 d, then oral to complete 4 wk.",
rf:"Any postauricular swelling or ear protrusion."},
{n:"Acute sinusitis",c:"Sinus",t:["facial","nasdis","cong","fever","anosmia","cough"],
pt:"Mostly viral (acute <4 wk; subacute 4–12; chronic ≥12 wk). Obstruction of sinus ostia → secretions retained; only ~20% bacterial. Risks: age 45–65, smoking, asthma, air travel, allergy.",
dx:"Clinical: purulent discharge, facial pain/pressure, congestion, hyposmia, postnasal drip, tooth pain. Transillumination is not accurate. Antibiotic criteria: persistent ≥10 d; severe (T >102°F + purulent discharge or pain 3–4 d); worsening after initial improvement (5–6 d). Imaging (noncontrast CT) only for complications/failure.",
tx:"Symptom care: analgesics, saline, intranasal steroids, oxymetazoline ≤5 d or oral decongestant. If criteria met: amoxicillin/clavulanate 875/125 mg bid ×7 d (alt. amoxicillin 875 mg bid ×7 d); mild PCN allergy cefuroxime; severe allergy doxycycline. Avoid macrolides. No improvement 3–5 d: amox/clav 2000/125 bid ×7 d or levofloxacin (fluoroquinolone risks). Refer to ENT/CT if still failing. ≥4 episodes/yr = recurrent.",
rf:"Worsening/recurrent fever >102°F, orbital swelling, vision change, confusion, proptosis."},
{n:"Chronic sinusitis",c:"Sinus",t:["facial","cong","anosmia","nasdis","polyps","cough"],
pt:"Inflammatory disease of paranasal sinuses >12 wk: Th1 (no polyps, bacterial), Th2/eosinophilic (polyps, asthma, aspirin sensitivity), allergic fungal. Contributors: allergens, smoke, structural problems, impaired clearance (CF), immunodeficiency.",
dx:"Facial pain, discharge, congestion, hyposmia. Confirm with endoscopy/CT (up to 40% show no mucosal change). Unilateral polyps/bloody discharge → rule out tumor. Allergic fungal: greenish-brown peanut-butter mucus, hyphae.",
tx:"Avoid triggers; saline irrigation; mometasone/fluticasone sprays or budesonide rinses (mainstay). Oral steroid 2–3 wk if refractory with polyps. Antihistamines/montelukast if allergic. Macrolide 3 mo may help non-polyp disease; antifungals no benefit. Endoscopic surgery if medical failure; AFRS needs surgery + perioperative steroids.",
rf:"Unilateral polyp, bloody discharge."},
{n:"Invasive fungal sinusitis",c:"Sinus",t:["facial","fever","diab","nasdis"],
pt:"Mucorales/Aspergillus in uncontrolled diabetes or transplant/immunosuppression; rapid angioinvasion with cranial nerve, orbital extension.",
dx:"Emergency. Facial pain, headache, fever, then orbital swelling, proptosis, chemosis, ophthalmoplegia. Endoscopy with biopsy; gadolinium MRI.",
tx:"IV antifungals + surgical debridement.",rf:"Facial pain with diabetes/immunosuppression."},
{n:"Streptococcal (GAS) pharyngitis",c:"Throat",t:["sore","fever","exud","nodes","nocough","scarl","dysph"],
pt:"Group A β-hemolytic streptococcus: ~10% of adults, up to 35% of children with sore throat; winter/spring, 5–15 y. Complications: acute rheumatic fever, post-strep GN, scarlet fever, peritonsillar abscess.",
dx:"Centor criteria (fever history, no cough, tender anterior nodes, exudate). Rapid antigen test: sens ~80–90%, spec ~95%; culture sens 85–90%. Carriers confound. Children: confirm with testing.",
tx:"Analgesics, saline gargles, honey tea. Penicillin V 500 mg qid or 1000 mg bid ×10 d (first choice). Amoxicillin 500 mg bid or 1000 mg daily ×10 d. Cephalexin 500 bid ×10 d; cefadroxil 1 g daily ×10 d (non-anaphylactic allergy). Severe allergy: erythromycin 250–500 qid or 500–1000 bid ×5 d; clarithromycin 500 bid ×5 d; clindamycin 300 tid ×10 d. Steroids not recommended.",
rf:"Rigors, neck swelling, drooling, trouble swallowing, symptoms >5 d."},
{n:"Infectious mononucleosis (EBV)",c:"Throat",t:["sore","fever","nodes","postnodes","spleen","exud","myalgia"],
pt:"New EBV infection causes 1–6% of pharyngitis in young adults; rare >40 y. Full syndrome in ~25%.",
dx:"Triad: clinical, hematologic, serologic. Marked posterior cervical/auricular adenopathy, splenomegaly, exudative pharyngitis, palatal petechiae, gelatinous uvula. Lymphocytes >4000/µL or >50% with >10% atypical. Heterophil Ab positive in ~40% wk 1, 80–90% by wk 3.",
tx:"Supportive: analgesics, hydration.",rf:"Airway compromise from tonsillar swelling."},
{n:"Gonococcal pharyngitis",c:"Throat",t:["sore","sex","fever","exud"],
pt:"N. gonorrhoeae in ~1% of adults with sore throat; often asymptomatic pharyngeal infection.",
dx:"Suspect in MSM, women with fellatio, urogenital symptoms, or persistent sore throat unresponsive to presumed strep treatment. Test specifically.",
tx:"Treat per current gonorrhea guidelines (Chap. 202); not detailed in this chapter.",rf:""},
{n:"Acute HIV infection",c:"Throat",t:["sore","fever","rash","myalgia","nodes","sex"],
pt:"About half of acute HIV patients have sore throat; only ~1% of viral/mono-like illness is HIV in the US.",
dx:"Sore throat with headache, malaise, fever, myalgias, lymphadenopathy, anorexia, rash; new partner in past month.",
tx:"Test for HIV (see Chap. 202).",rf:""},
{n:"Diphtheria",c:"Throat",t:["sore","pseudo","travel"],
pt:"Corynebacterium diphtheriae, endemic in developing countries.",dx:"Travel to endemic area; mild pharyngitis with grayish pseudomembrane.",tx:"See Chap. 150.",rf:"Pseudomembrane."},
{n:"Lemierre’s syndrome",c:"Throat",t:["sore","neck","fever","rigors","dysph"],
pt:"Septic thrombophlebitis of internal jugular vein with metastatic infection (lung, joints, bones, liver, meninges, brain). Fusobacterium necrophorum most common; teens/young adults, predominantly male.",
dx:"Consider in teen/young adult with non-GAS pharyngitis not resolving, with rigors, neck pain/swelling or extrapharyngeal symptoms.",
tx:"Not detailed in chapter; urgent evaluation and anaerobic-covering antibiotics.",rf:"Rigors, neck swelling."},
{n:"Head & neck abscess (peritonsillar, retropharyngeal, submandibular)",c:"Throat",t:["sore","dysph","trism","drool","hotp","neck","fever","diab","child"],
pt:"Complication of dental, salivary, tonsillar, sinus or ear infection, IV drug use. Streptococci, anaerobes, S. aureus. Spread along fascial planes → mediastinitis, carotid sheath, meninges, airway compromise.",
dx:"Peritonsillar: fever, dysphagia, severe throat pain, trismus, hot-potato voice, unilateral palatal bulge, uvular deviation. Retropharyngeal: child with neck pain/stiffness, drooling. Submandibular (Ludwig): floor-of-mouth swelling. CT imaging (except obvious peritonsillar).",
tx:"Secure airway, surgical drainage, IV antibiotics (ampicillin/sulbactam; clindamycin + ceftriaxone; meropenem). Peritonsillar: needle aspiration or tonsillectomy.",
rf:"Stridor, dyspnea, drooling, trismus."},
{n:"Epiglottitis / supraglottitis",c:"Throat",t:["sore","dysph","stridor","drool","hotp","hoarse","fever"],
pt:"Supraglottic inflammation; H. influenzae type b historically in children (now rarer after vaccine), adults: S. pneumoniae, S. pyogenes, S. aureus, H. influenzae.",
dx:"Sore throat, dysphagia, odynophagia, hoarseness, stridor, tripod posture, drooling. Do not examine or swab except in a controlled setting. Lateral neck film: thumb sign. Examine in OR with airway readiness.",
tx:"Observe in hospital; early intubation/tracheostomy by an experienced operator; humidified oxygen, nebulized saline, glucocorticoids, IV antibiotics, nebulized epinephrine.",
rf:"Airway obstruction can be sudden."},
{n:"Laryngitis",c:"Throat",t:["hoarse","sore","cough"],
pt:"Mostly viral (parainfluenza/croup in children); bacterial (S. pneumoniae, H. influenzae, M. catarrhalis) ~7 d into illness. Noninfectious: vocal trauma, reflux, allergy, inhalational injury, smoking.",
dx:"Raspy/hoarse/breathy voice, dry cough, anterior throat pain; clinical. Laryngoscopy if needed.",
tx:"Self-limited 3–7 d (up to 14). Vocal rest, humidification, hydration; antireflux measures; antibiotics ineffective. ENT/speech referral if voice-dependent job or >3 wk.",
rf:"Dyspnea, stridor, drooling (epiglottitis); smoker with weight loss >3 wk (malignancy)."}];
const Q=[["Which are the only common acute respiratory infections that should be treated with antibiotics?",["AOM, sinusitis, strep pharyngitis, pneumonia","Common cold, bronchitis","Laryngitis, influenza","All sore throats"],0],
["A Centor score of 4 in an adult carries about what probability of GAS?",["2%","8%","19%","41%"],3],
["Antibiotic of choice for GAS pharyngitis?",["Azithromycin ×5 d","Penicillin ×10 d","Levofloxacin","Dexamethasone"],1],
["Which finding on exam distinguishes otitis externa from AOM with perforation?",["Fever","Pain on moving auricle/tragus","Hearing loss","Otorrhea"],1],
["Patient with diabetes, ear pain and CN VII palsy: ?",["Cholesteatoma","OME","Malignant otitis externa","AOM"],2],
["Preferred imaging for sinusitis with complications or failure?",["Plain films","Transillumination","Noncontrast CT","Ultrasound"],2],
["Which antibiotic class is NOT recommended for sinusitis?",["Amox/clav","Doxycycline","Macrolides","Cefuroxime"],2],
["Child with sore throat, drooling, trismus and neck stiffness after URI suggests?",["Retropharyngeal abscess","Laryngitis","Cold","OME"],0],
["Diabetic with facial pain, fever, black eschar-like nasal tissue and proptosis?",["Chronic sinusitis","Invasive fungal sinusitis","Allergic rhinitis","Strep"],1]];
const $=s=>document.querySelector(s),app=$("#app");let sel=new Set(),tab="assess",qi=0,score=0;
const tabs=[["assess","Assess"],["search","Search"],["lib","Conditions"],["tools","Tools"],["learn","Learn"]];
function nav(){$("#nav").innerHTML=tabs.map(([k,v])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${v}</button>`).join("")}
function go(t){tab=t;nav();R[t]();scrollTo(0,0)}
function card(d,m=[]){return `<details><summary>${d.n} <span class="tag">${d.c}</span>${m.length?`<div class="chips" style="margin-top:4px">${m.map(x=>`<span class="chip m">${L[x]}</span>`).join("")}</div>`:""}</summary><div>
<h3>Assessment (key features)</h3><div class="chips">${d.t.map(x=>`<span class="chip m">${L[x]}</span>`).join("")}</div>
<h3>Pathophysiology</h3>${d.pt}<h3>Diagnosis</h3>${d.dx}<h3>Treatment</h3>${d.tx}${d.rf?`<h3 class="rf">Red flags</h3><span class="rf">${d.rf}</span>`:""}</div></details>`}
const R={
assess(){app.innerHTML=`<p class="mu">Tap the complaints and findings present. Likely diagnoses are ranked by matching features.</p>`+Object.entries(G).map(([g,a])=>`<h2>${g}</h2><div class="chips">${a.map(k=>`<button class="chip ${sel.has(k)?"on":""}" onclick="tg('${k}')">${L[k]}</button>`).join("")}</div>`).join("")+`<div style="margin:12px 0"><button class="btn" onclick="sel.clear();R.assess()">Clear</button></div><div id="res"></div>`;res()},
search(){app.innerHTML=`<input type="search" id="q" placeholder="Search complaint or diagnosis (e.g. hoarse, mastoid, amoxicillin)" oninput="sr()"><div id="sr"></div>`;sr()},
lib(){app.innerHTML=["Ear","Sinus","Throat","URI"].map(c=>`<h2>${{Ear:"Ear pain",Sinus:"Sinus symptoms",Throat:"Sore throat & neck",URI:"Upper respiratory infection"}[c]}</h2>`+D.filter(d=>d.c==c).map(d=>card(d)).join("")).join("")},
tools(){app.innerHTML=`<div class="card"><h2 style="margin-top:0">Centor score (adult sore throat)</h2>${["History of fever","No cough","Tender anterior cervical lymphadenopathy","Tonsillar swelling or exudate"].map((x,i)=>`<label class="k"><input type="checkbox" class="cn" onchange="cen()">${x}</label>`).join("")}<div id="cr" style="font-weight:600;margin-top:6px"></div></div>
<div class="card"><h2 style="margin-top:0">Centor table</h2><div class="wrap"><table><tr><th>Points</th><th>GAS %</th><th>Action</th></tr><tr><td>0</td><td>2</td><td>No test, no antibiotic</td></tr><tr><td>1</td><td>3</td><td>No test, no antibiotic</td></tr><tr><td>2</td><td>8</td><td>Rapid test</td></tr><tr><td>3</td><td>19</td><td>Rapid test</td></tr><tr><td>4</td><td>41</td><td>Empirical antibiotic or rapid test</td></tr></table></div><p class="mu">Lower threshold for testing: prior rheumatic fever, recent exposure, epidemic, diabetes/immunocompromise.</p></div>
<div class="card"><h2 style="margin-top:0">Antibiotics for acute sinusitis</h2><ul><li>Persistent ≥10 d</li><li>Severe: T >102°F + purulent discharge/pain 3–4 d</li><li>Worsening after 5–6 d of improvement</li></ul><p class="mu">Only ~20% of adults with sinusitis meet criteria.</p></div>
<div class="card"><h2 style="margin-top:0">AOM antibiotic indications</h2><div class="wrap"><table><tr><td>&lt;6 mo</td><td>Reasonable for all</td></tr><tr><td>6 mo–2 y</td><td>Bilateral findings</td></tr><tr><td>≥6 mo</td><td>Otorrhea</td></tr><tr><td>&gt;2 y</td><td>Worse or no better in 48–72 h</td></tr><tr><td>All ages</td><td>Severe otalgia, ≥2 d, or T >102.2°F</td></tr></table></div></div>
<div class="card"><h2 style="margin-top:0">Stewardship</h2>At least half of ambulatory antibiotic prescriptions for acute respiratory infections are inappropriate. Effective: peer comparison, accountable justification, precommitment, decision support, patient education, clear diagnosis, positive actions, red-flag counseling. Avoid delayed prescriptions. Procalcitonin and CRP testing not durable.</div>`},
learn(){qi=0;score=0;qz()}};
function tg(k){sel.has(k)?sel.delete(k):sel.add(k);R.assess()}
function res(){const o=$("#res");if(!sel.size){o.innerHTML="";return}
const r=D.map(d=>{const m=d.t.filter(x=>sel.has(x));return{d,m,s:m.length/Math.sqrt(d.t.length)}}).filter(x=>x.m.length).sort((a,b)=>b.s-a.s).slice(0,6);
o.innerHTML=`<h2>Possible diagnoses</h2>`+(r.map(x=>card(x.d,x.m)).join("")||"<p class='mu'>No matches</p>")+`<p class="mu">Ranking is a teaching aid based on chapter features, not a diagnosis.</p>`}
function sr(){const q=($("#q").value||"").toLowerCase().trim(),o=$("#sr");
const r=D.filter(d=>!q||(d.n+d.c+Object.values(d).filter(v=>typeof v=="string").join(" ")+d.t.map(x=>L[x]).join(" ")).toLowerCase().includes(q));
const cp=q?Object.entries(L).filter(([k,v])=>v.toLowerCase().includes(q)):[];
o.innerHTML=(cp.length?`<h2>Matching complaints</h2><div class="chips">${cp.map(([k,v])=>`<button class="chip" onclick="sel=new Set(['${k}']);go('assess')">${v}</button>`).join("")}</div>`:"")+`<h2>${r.length} condition(s)</h2>`+r.map(d=>card(d)).join("")}
function cen(){const n=[...document.querySelectorAll(".cn")].filter(x=>x.checked).length,p=[2,3,8,19,41][n],a=["No test, no antibiotic","No test, no antibiotic","Rapid antigen test","Rapid antigen test","Empirical antibiotic or rapid test"][n];$("#cr").textContent=`Score ${n}: ~${p}% GAS. ${a}.`}
function qz(){if(qi>=Q.length){app.innerHTML=`<div class="card"><h2>Score: ${score}/${Q.length}</h2><button class="btn" onclick="go('learn')">Retry</button></div>`;return}
const [q,o]=Q[qi];app.innerHTML=`<div class="card"><p class="mu">Question ${qi+1}/${Q.length}</p><b>${q}</b>${o.map((x,i)=>`<button class="opt" onclick="an(${i},this)">${x}</button>`).join("")}</div>`}

app.firstChild.insertAdjacentHTML("beforeend",`<button class="btn" onclick="qi++;qz()" style="margin-top:8px">Next</button>`)}
nav();R.assess();
</script></body></html>
